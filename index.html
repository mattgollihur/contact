  <title>Matt Gollihur | Zurich North America</title>

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

    }

      font-size: 1.6em;
      margin-bottom: 0.2em;

    h2 {
      font-size: 1em;

      font-weight: normal;
    }

      background-color: #0033A0;

      padding: 14px 0;

      border-radius: 8px;
      font-size: 1em;
      width: 90%;
      max-width: 340px;
      transition: background-color 0.2s ease-in-out;
    }

    .button:hover {
      background-color: #00247D;
    }

    .tip {
      margin-top: 10px;
      font-size: 0.9em;
      color: #666;
    }

    footer {
      margin-top: 30px;
      font-size: 0.75em;
      color: #aaa;
    }
  </style>
